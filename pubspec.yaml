name: clients_app
description: "Client dashboard demo focused on smooth animations and a clean UI."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# Keep each section alphabetically sorted. Add a package only with a
# justification (see .claude/steering/tech.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  google_fonts: ^9.0.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  riverpod_annotation: ^4.0.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  # Pinned below 4.x: freezed 4 stable requires Dart >=3.13.
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/images/clients/
    # Bundled so text never waits on (or leaks visits to) fonts.gstatic.com.
    - assets/google_fonts/

# Regenerate with `dart run flutter_launcher_icons` after editing tool/icon/.
flutter_launcher_icons:
  image_path: tool/icon/full.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#171915"
  adaptive_icon_foreground: tool/icon/fg.png
  web:
    generate: true
    image_path: tool/icon/full.png
    background_color: "#F5F4EE"
    theme_color: "#171915"
